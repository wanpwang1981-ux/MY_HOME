<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 圖片生成器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Hide the default file input button */
        #imageUpload {
            display: none;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 bg-gray-100">

    <div class="bg-white rounded-xl shadow-2xl p-6 md:p-10 w-full max-w-2xl transform transition-all duration-500 hover:scale-[1.01]">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">AI 圖片生成器</h1>
        <p class="text-center text-gray-500 mb-6">請選擇生成模式，輸入描述，然後點擊「生成圖片」。</p>

        <!-- 輸入與操作區塊 -->
        <div class="mb-6 space-y-4">
            <!-- 模式選擇 -->
            <div class="flex justify-center space-x-4 p-2 bg-gray-100 rounded-lg">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="radio" name="mode" value="text-to-image" class="form-radio text-blue-600" checked>
                    <span class="text-gray-700 font-medium">文生圖</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="radio" name="mode" value="text-and-image-to-image" class="form-radio text-blue-600">
                    <span class="text-gray-700 font-medium">文+圖生圖</span>
                </label>
            </div>

            <!-- 圖片上傳 (預設隱藏) -->
            <div id="imageUploadContainer" class="hidden">
                <label for="imageUpload" class="w-full flex flex-col items-center justify-center p-4 text-gray-500 bg-gray-50 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer hover:bg-gray-100 transition-colors">
                    <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-4-4V6a4 4 0 014-4h1.586a1 1 0 01.707.293l1.414 1.414a1 1 0 00.707.293h4.172a4 4 0 014 4v6a4 4 0 01-4 4H7z"></path></svg>
                    <span id="imageUploadText">點擊此處上傳圖片</span>
                    <input type="file" id="imageUpload" accept="image/png, image/jpeg, image/webp">
                </label>
            </div>

            <!-- 圖片描述輸入欄位 -->
            <textarea
                id="promptInput"
                class="w-full h-24 p-4 text-gray-700 bg-gray-50 border-2 border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-colors"
                placeholder="例如：一隻貓在太空船裡，卡通風格"
            ></textarea>

            <button
                id="generateBtn"
                class="w-full flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105"
            >
                <span id="buttonText">生成圖片</span>
                <svg id="loadingSpinner" class="animate-spin h-5 w-5 ml-3 text-white hidden" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </div>

        <!-- 圖片顯示與結果區塊 -->
        <div id="resultContainer" class="hidden">
            <h2 class="text-lg font-semibold text-gray-700 text-center mb-4">生成結果：</h2>
            <div class="relative w-full aspect-square bg-gray-200 rounded-lg overflow-hidden shadow-inner flex items-center justify-center">
                <img id="resultImage" class="w-full h-full object-cover">
                <div id="loadingOverlay" class="absolute inset-0 bg-white bg-opacity-80 flex flex-col items-center justify-center transition-opacity duration-300">
                    <svg class="animate-spin h-10 w-10 text-blue-600 mb-4" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="text-gray-600 font-medium">圖片生成中，請稍候...</p>
                </div>
            </div>
            <div class="mt-4">
                <p class="text-sm text-gray-600">最終提示：</p>
                <p id="finalPrompt" class="text-sm text-gray-800 bg-gray-100 p-2 rounded"></p>
            </div>
        </div>

        <!-- 訊息與錯誤提示 -->
        <div id="messageBox" class="hidden mt-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative" role="alert">
            <span class="block sm:inline" id="messageText"></span>
        </div>
    </div>

    <script>
        // API 端點指向我們的 Flask 後端
        const API_ENDPOINT = '/api/generate';

        // 取得 UI 元素
        const modeRadios = document.querySelectorAll('input[name="mode"]');
        const imageUploadContainer = document.getElementById('imageUploadContainer');
        const imageUpload = document.getElementById('imageUpload');
        const imageUploadText = document.getElementById('imageUploadText');
        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const resultContainer = document.getElementById('resultContainer');
        const resultImage = document.getElementById('resultImage');
        const finalPrompt = document.getElementById('finalPrompt');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const buttonText = document.getElementById('buttonText');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const messageBox = document.getElementById('messageBox');
        const messageText = document.getElementById('messageText');

        // 處理模式切換
        modeRadios.forEach(radio => {
            radio.addEventListener('change', (event) => {
                if (event.target.value === 'text-and-image-to-image') {
                    imageUploadContainer.classList.remove('hidden');
                } else {
                    imageUploadContainer.classList.add('hidden');
                }
            });
        });

        // 處理圖片上傳檔名顯示
        imageUpload.addEventListener('change', () => {
            if (imageUpload.files.length > 0) {
                imageUploadText.textContent = imageUpload.files[0].name;
            } else {
                imageUploadText.textContent = '點擊此處上傳圖片';
            }
        });

        // 處理 API 請求
        async function generateImage() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            const prompt = promptInput.value.trim();
            const imageFile = imageUpload.files[0];

            if (!prompt) {
                showMessage('請輸入圖片描述！');
                return;
            }

            if (mode === 'text-and-image-to-image' && !imageFile) {
                showMessage('在「文+圖生圖」模式下，請上傳一張圖片。');
                return;
            }

            // UI 狀態：顯示載入中
            generateBtn.disabled = true;
            loadingSpinner.classList.remove('hidden');
            buttonText.textContent = '生成中...';
            resultContainer.classList.add('hidden');
            loadingOverlay.classList.remove('hidden');
            hideMessage();

            const formData = new FormData();
            formData.append('mode', mode);
            formData.append('prompt', prompt);
            if (imageFile) {
                formData.append('image', imageFile);
            }

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `請求失敗，錯誤碼: ${response.status}`);
                }

                const result = await response.json();

                if (result.imageUrl) {
                    // 加上時間戳以避免瀏覽器快取舊圖片
                    resultImage.src = `${result.imageUrl}?t=${new Date().getTime()}`;
                    finalPrompt.textContent = result.finalPrompt || 'N/A';
                    resultContainer.classList.remove('hidden');
                    loadingOverlay.classList.add('hidden');
                } else {
                    throw new Error(result.error || 'API 回應中未找到圖片 URL。');
                }

            } catch (error) {
                console.error('圖片生成錯誤:', error);
                showMessage(`圖片生成失敗：${error.message}`);
            } finally {
                // UI 狀態：恢復按鈕
                generateBtn.disabled = false;
                loadingSpinner.classList.add('hidden');
                buttonText.textContent = '生成圖片';
            }
        }

        // 顯示訊息框
        function showMessage(message) {
            messageText.textContent = message;
            messageBox.classList.remove('hidden');
        }

        // 隱藏訊息框
        function hideMessage() {
            messageBox.classList.add('hidden');
        }

        // 註冊事件監聽器
        generateBtn.addEventListener('click', generateImage);
    </script>
</body>
</html>
